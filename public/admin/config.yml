backend:
  name: git-gateway
  branch: main
  # This site is hosted on Vercel, not Netlify. Identity + Git Gateway run on
  # a separate Netlify site created only for auth — replace YOUR-NETLIFY-SITE-NAME
  # below with that site's real subdomain once it exists.
  identity_url: https://YOUR-NETLIFY-SITE-NAME.netlify.app/.netlify/identity
  gateway_url: https://YOUR-NETLIFY-SITE-NAME.netlify.app/.netlify/git

local_backend: true

publish_mode: simple

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "business"
    label: "Business Info"
    description: "Contact details and business info shown across the site (phone, email, address, hours)."
    files:
      - name: "main"
        label: "Business Info & Contact Details"
        file: "src/content/business/main.json"
        fields:
          - { label: "Business Name", name: "name", widget: "string" }
          - { label: "Website URL", name: "url", widget: "string" }
          - { label: "Phone number (for click-to-call, e.g. +447391599078, no spaces)", name: "phone", widget: "string" }
          - { label: "Phone number (as displayed, e.g. +44 7391 599 078)", name: "phoneDisplay", widget: "string" }
          - { label: "Email address", name: "email", widget: "string" }
          - { label: "Postal address", name: "address", widget: "string" }
          - { label: "City", name: "city", widget: "string" }
          - { label: "County", name: "county", widget: "string" }
          - { label: "Postcode", name: "postcode", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Business description", name: "description", widget: "text" }
          - { label: "Price range (e.g. ££)", name: "priceRange", widget: "string" }
          - { label: "Opening hours (e.g. Mo-Su 07:00-20:00)", name: "openingHours", widget: "string" }
          - label: "Areas served"
            name: "areaServed"
            widget: "list"
            hint: "Towns and villages you cover, one per line."
          - { label: "Quote form submission address", name: "formAction", widget: "string" }
          - { label: "Google Maps link", name: "googleMapsUrl", widget: "string" }

  - name: "reviewsSettings"
    label: "Reviews Settings"
    description: "The overall rating summary shown above your Google reviews."
    files:
      - name: "main"
        label: "Overall Rating Display"
        file: "src/content/reviewsSettings/main.json"
        fields:
          - { label: "Link to your Google reviews page", name: "googleReviewUrl", widget: "string" }
          - { label: "Overall star rating (e.g. 5.0)", name: "overallRating", widget: "string" }
          - { label: "Total number of reviews", name: "reviewCount", widget: "number", value_type: "int" }

  - name: "trustBadges"
    label: "Trust Badge Certificates"
    description: "Optional certificate numbers shown on the insurance and DBS trust badges. Leave blank to hide."
    files:
      - name: "main"
        label: "Certificate Numbers"
        file: "src/content/trustBadges/main.json"
        fields:
          - { label: "Public Liability Insurance policy number", name: "publicLiabilityPolicyNumber", widget: "string", required: false }
          - { label: "DBS certificate number", name: "dbsCertificateNumber", widget: "string", required: false }

  - name: "testimonials"
    label: "Testimonials"
    description: "Customer reviews shown on the homepage and about page."
    folder: "src/content/testimonials"
    create: true
    slug: "{{fields.name}}"
    identifier_field: "name"
    fields:
      - { label: "Customer name", name: "name", widget: "string" }
      - { label: "Star rating", name: "rating", widget: "number", min: 1, max: 5, step: 1, value_type: "int" }
      - { label: "Review text", name: "text", widget: "text" }
      - { label: "Date of review", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Badge (optional, e.g. Local Guide)", name: "badge", widget: "string", required: false }

  - name: "gallery"
    label: "Work Gallery"
    description: "Photos shown in the 'Recent Jobs' gallery on the homepage."
    folder: "src/content/gallery"
    create: true
    slug: "{{fields.caption}}"
    identifier_field: "caption"
    fields:
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Alt text (short description for accessibility)", name: "alt", widget: "string" }
      - { label: "Caption", name: "caption", widget: "string" }

  - name: "pageContent"
    label: "Services & Info Pages"
    description: "Edit the written content on each service and information page. Page titles, URLs, and internal links are managed separately and are not editable here — contact your developer for those changes."
    folder: "src/content/pageContent"
    create: false
    delete: false
    slug: "{{slug}}"
    fields:
      - { label: "Introduction paragraph", name: "intro", widget: "text", required: false }
      - label: "Content sections"
        name: "sections"
        widget: "list"
        summary: "{{fields.heading}}"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Body text", name: "body", widget: "text" }
      - label: "Frequently asked questions"
        name: "faqs"
        widget: "list"
        summary: "{{fields.q}}"
        fields:
          - { label: "Question", name: "q", widget: "string" }
          - { label: "Answer", name: "a", widget: "text" }
